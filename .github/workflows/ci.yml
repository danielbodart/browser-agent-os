name: CI

on:
  push:
  pull_request:

# One run per ref; a newer push cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own browser downloader hangs after the download completes on
    # bare GitHub runners (both bunx and npx, both noble and jammy). The official
    # Playwright image ships the matching Chromium pre-installed at
    # $PLAYWRIGHT_BROWSERS_PATH, so no download happens at all. Keep the tag in
    # sync with the `playwright` version in package.json / bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    steps:
      - uses: actions/checkout@v4

      # Installs mise + the tools pinned in mise.toml (zig, bun, node) and caches them.
      - uses: jdx/mise-action@v2

      - name: Install JS dependencies
        run: mise run install:deps

      # build:bins (zig + wasm-opt) -> typecheck -> full test suite, including the
      # headless-Chrome host-browser smoke tests (Chromium from the container image).
      - name: Build, typecheck, test
        run: mise run build
