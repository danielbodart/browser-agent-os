name: CI

on:
  push:
  pull_request:

# One run per ref; a newer push cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 22.04 (jammy), not ubuntu-latest (24.04/noble): Playwright 1.59.x has no
    # official Chromium build for noble, falls back to an unofficial build, and
    # the install hangs after download until the job times out. Jammy is a
    # supported target and downloads the real build.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installs mise + the tools pinned in mise.toml (zig, bun, node) and caches them.
      - uses: jdx/mise-action@v2

      - name: Install JS dependencies
        run: mise run install:deps

      # Headless-Chrome smoke tests (host-browser) drive Playwright Chromium.
      # npx (Node), NOT bunx: bun's runner doesn't cleanly exit Playwright's Node
      # CLI after the browser download finishes and hangs until the job times out.
      # --with-deps pulls the OS libraries the browser needs on a bare runner.
      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      # build:bins (zig + wasm-opt) -> typecheck -> full test suite.
      - name: Build, typecheck, test
        run: mise run build
